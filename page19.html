<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>VVIP Student Black Card</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0b0b;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Poppins',sans-serif;
  overflow:hidden;
}

/* ===== PRINT SIZE ===== */
/* ID CARD STANDARD */
/* 85.6mm × 54mm */

.card{

  width:85.6mm;
  height:54mm;

  position:relative;
  overflow:hidden;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #050505,
    #121212 40%,
    #1a1a1a 60%,
    #050505
  );

  border:1px solid rgba(255,215,120,.25);

  box-shadow:
  0 10px 30px rgba(0,0,0,.65),
  inset 0 1px 1px rgba(255,255,255,.08);

  padding:18px;

}

/* ===== GOLD LIGHT ===== */

.card::before{

  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(
    120deg,
    transparent 25%,
    rgba(255,215,120,.08) 50%,
    transparent 75%
  );

  animation:shine 5s linear infinite;

}

@keyframes shine{

  from{
    transform:translateX(-100%);
  }

  to{
    transform:translateX(100%);
  }

}

/* ===== DECOR ===== */

.circle-top{

  position:absolute;
  width:180px;
  height:180px;

  border-radius:50%;

  top:-110px;
  right:-60px;

  background:
  radial-gradient(
    circle,
    rgba(255,215,120,.18),
    transparent 70%
  );

}

.circle-bottom{

  position:absolute;
  width:140px;
  height:140px;

  border-radius:50%;

  bottom:-80px;
  left:-70px;

  background:
  radial-gradient(
    circle,
    rgba(255,215,120,.08),
    transparent 70%
  );

}

/* ===== TOP ===== */

.top{

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  position:relative;
  z-index:2;

}

.brand{

  color:#f5d18a;
  font-size:11px;
  letter-spacing:3px;
  font-weight:600;

}

.level{

  color:#f5d18a;
  border:1px solid rgba(245,209,138,.35);

  padding:4px 10px;
  border-radius:30px;

  font-size:8px;
  letter-spacing:1px;

  background:rgba(255,215,120,.05);

}

/* ===== CENTER ===== */

.center{

  position:relative;
  z-index:2;

  margin-top:22px;

}

.title{

  color:white;

  font-size:28px;
  font-weight:700;

  letter-spacing:2px;
  line-height:1;

}

.subtitle{

  margin-top:8px;

  color:#d0d0d0;

  font-size:8px;
  line-height:1.6;

  width:70%;

}

/* ===== BENEFIT ===== */

.benefit{

  margin-top:12px;

  display:flex;
  gap:6px;
  flex-wrap:wrap;

}

.badge{

  font-size:7px;

  color:#f5d18a;

  border:1px solid rgba(245,209,138,.18);

  background:rgba(255,215,120,.06);

  padding:4px 7px;

  border-radius:20px;

  letter-spacing:.5px;

}

/* ===== BOTTOM ===== */

.bottom{

  position:absolute;

  bottom:16px;
  left:18px;
  right:18px;

  display:flex;
  justify-content:space-between;
  align-items:end;

  z-index:2;

}

.owner{

  color:white;

}

.owner-name{

  font-size:11px;
  font-weight:600;
  letter-spacing:1px;

}

.owner-role{

  margin-top:2px;

  font-size:7px;
  color:#bbbbbb;

  letter-spacing:1px;

}

.number{

  color:#f5d18a;

  font-size:10px;

  letter-spacing:3px;

}

/* ===== CHIP ===== */

.chip{

  position:absolute;

  right:20px;
  top:70px;

  width:42px;
  height:30px;

  border-radius:8px;

  background:
  linear-gradient(
    135deg,
    #caa85e,
    #ffe7a8,
    #9b7939
  );

  z-index:2;

  box-shadow:
  inset 0 1px 2px rgba(255,255,255,.35);

}

.chip::before{

  content:"";

  position:absolute;

  top:0;
  bottom:0;
  left:50%;

  width:1px;

  background:rgba(0,0,0,.15);

}

.chip::after{

  content:"";

  position:absolute;

  left:0;
  right:0;
  top:50%;

  height:1px;

  background:rgba(0,0,0,.15);

}

/* ===== PRINT ===== */

@media print{

  body{
    background:white;
  }

  .card{
    box-shadow:none;
  }

}

/* ===== CARD ===== */

.card{

  width:85.6mm;
  height:54mm;

  position:relative;
  overflow:hidden;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #050505,
    #121212 40%,
    #1a1a1a 60%,
    #050505
  );

  /* GLOW EMAS */
  border:1.5px solid #ffd978;

  box-shadow:
  0 0 8px rgba(255,215,120,.9),
  0 0 18px rgba(255,215,120,.65),
  0 0 35px rgba(255,215,120,.45),
  0 10px 30px rgba(0,0,0,.7),
  inset 0 0 12px rgba(255,215,120,.12),
  inset 0 1px 1px rgba(255,255,255,.1);

  padding:18px;

}

/* ===== OUTER GOLD FRAME ===== */

.card::after{

  content:"";

  position:absolute;

  inset:7px;

  border-radius:12px;

  border:1px solid rgba(255,223,130,.65);

  box-shadow:
  0 0 10px rgba(255,223,130,.9),
  0 0 25px rgba(255,223,130,.55),
  inset 0 0 8px rgba(255,223,130,.25);

  pointer-events:none;

}

/* ===== GOLD LIGHT EFFECT ===== */

.card::before{

  content:"";

  position:absolute;
  inset:-120%;

  background:
  linear-gradient(
    120deg,
    transparent 30%,
    rgba(255,230,150,.16) 45%,
    rgba(255,255,255,.3) 50%,
    rgba(255,230,150,.16) 55%,
    transparent 70%
  );

  transform:rotate(15deg);

  animation:shine 4s linear infinite;

}

@keyframes shine{

  from{
    transform:
    translateX(-100%)
    rotate(15deg);
  }

  to{
    transform:
    translateX(100%)
    rotate(15deg);
  }

}

/* ===== GLOW LINE ===== */

.gold-line{

  position:absolute;

  left:18px;
  right:18px;
  bottom:48px;

  height:1px;

  background:
  linear-gradient(
    90deg,
    transparent,
    #ffd978,
    #fff1b3,
    #ffd978,
    transparent
  );

  box-shadow:
  0 0 8px rgba(255,215,120,.95),
  0 0 18px rgba(255,215,120,.75),
  0 0 28px rgba(255,215,120,.55);

  z-index:2;

}

/* ===== BADGE GLOW ===== */

.badge{

  font-size:7px;

  color:#ffe7a8;

  border:1px solid rgba(255,223,130,.35);

  background:rgba(255,215,120,.07);

  padding:4px 7px;

  border-radius:20px;

  letter-spacing:.5px;

  box-shadow:
  0 0 6px rgba(255,223,130,.4),
  inset 0 0 6px rgba(255,223,130,.12);

}

/* ===== TITLE GLOW ===== */

.title{

  color:white;

  font-size:28px;
  font-weight:700;

  letter-spacing:2px;
  line-height:1;

  text-shadow:
  0 0 10px rgba(255,255,255,.15),
  0 0 18px rgba(255,215,120,.25);

}

/* ===== NUMBER GLOW ===== */

.number{

  color:#ffe7a8;

  font-size:10px;

  letter-spacing:3px;

  text-shadow:
  0 0 8px rgba(255,223,130,.9),
  0 0 18px rgba(255,223,130,.5);

}

/* ===== CENTER ===== */

.center{

  position:relative;
  z-index:2;

  margin-top:18px;

  display:flex;
  flex-direction:column;
  gap:10px;

}

/* ===== TITLE ===== */

.title{

  color:white;

  font-size:22px;
  font-weight:700;

  letter-spacing:3px;
  line-height:1.05;

  text-shadow:
  0 0 10px rgba(255,215,120,.18);

}

/* ===== SUBTITLE ===== */

.subtitle{

  color:#f2c66d;

  font-size:8px;

  letter-spacing:4px;

  text-transform:uppercase;

}

/* ===== DESCRIPTION ===== */

.description{

  width:72%;

  color:#d7d7d7;

  font-size:7px;

  line-height:1.8;

  margin-top:4px;

}

/* ===== GOLD DIVIDER ===== */

.divider{

  width:100%;
  height:1px;

  margin-top:2px;

  background:
  linear-gradient(
    90deg,
    transparent,
    rgba(255,215,120,.9),
    transparent
  );

  box-shadow:
  0 0 10px rgba(255,215,120,.5);

}

/* ===== BENEFIT ===== */

.benefit{

  margin-top:2px;

  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:10px;

  align-items:center;

}

/* ===== BENEFIT ITEM ===== */

.benefit-item{

  text-align:center;

  position:relative;

}

/* garis pemisah */
.benefit-item:not(:last-child)::after{

  content:"";

  position:absolute;

  right:-5px;
  top:8px;

  width:1px;
  height:38px;

  background:
  linear-gradient(
    to bottom,
    transparent,
    rgba(255,215,120,.8),
    transparent
  );

}

/* ===== ICON ===== */

.icon{

  width:42px;
  height:42px;

  margin:auto;

  border-radius:50%;

  border:1px solid rgba(255,215,120,.7);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#ffd978;

  font-size:18px;

  box-shadow:
  0 0 12px rgba(255,215,120,.25),
  inset 0 0 10px rgba(255,215,120,.08);

}

/* ===== BENEFIT TITLE ===== */

.benefit-title{

  margin-top:8px;

  color:white;

  font-size:6.5px;

  line-height:1.5;

  letter-spacing:1px;

}

/* ===== BOTTOM ===== */

.bottom{

  position:absolute;

  left:18px;
  right:18px;
  bottom:14px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding-top:10px;

  border-top:1px solid rgba(255,215,120,.2);

}

/* ===== OWNER ===== */

.owner-name{

  color:white;

  font-size:10px;
  font-weight:600;

  letter-spacing:1px;

}

.owner-role{

  margin-top:3px;

  color:#f2c66d;

  font-size:7px;

  letter-spacing:3px;

}

/* ===== MEMBER ID ===== */

.member{

  text-align:right;

}

.member-label{

  color:#f2c66d;

  font-size:7px;

  letter-spacing:3px;

}

.number{

  margin-top:3px;

  color:#ffd978;

  font-size:18px;
  font-weight:700;

  letter-spacing:4px;

  text-shadow:
  0 0 10px rgba(255,215,120,.7);

}
</style>
</head>

<body>

<div class="card">

  <div class="circle-top"></div>
  <div class="circle-bottom"></div>

  <!-- TOP -->
  <div class="top">

    <div class="brand">
      BLACK ELITE
    </div>

    <div class="level">
      VVIP ACCESS
    </div>

  </div>

  <!-- CHIP -->
  <div class="chip"></div>

  <!-- CENTER -->
<div class="center">

  <div class="title">
    BLACK CARD
  </div>

  <div class="subtitle">
    VVIP STUDENT MEMBERSHIP
  </div>

  <div class="divider"></div>

  <div class="description">
    Exclusive student membership card with luxury privileges,
    priority access, and special VVIP treatment.
  </div>

  <div class="benefit">

    <div class="benefit-item">

      <div class="icon">%</div>

      <div class="benefit-title">
        10%<br>DISCOUNT
      </div>

    </div>

    <div class="benefit-item">

      <div class="icon">♛</div>

      <div class="benefit-title">

      </div>

    </div>

    <div class="benefit-item">

      <div class="icon">🔒</div>

      <div class="benefit-title">

      </div>

    </div>

    <div class="benefit-item">

      <div class="icon">♦</div>

      </div>

    </div>

  </div>

</div>

  <!-- BOTTOM -->
 <div class="bottom">

  <div>

    <div class="owner-name">

    </div>

    <div class="member-label">

    </div>

    <div class="number">
      #0001
    </div>

  </div>

</div>
  <div class="gold-line"></div>

</div>

</body>
</html>
