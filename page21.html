<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Poster Mobile</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

/* POSTER KHUSUS HP */
.poster{

  position:relative;

  width:100vw;
  height:100vh;

  max-width:430px;

  overflow:hidden;

  background:#000;
}

/* IMAGE FULL */
.poster img{

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  display:block;
}

/* OPTIONAL DARK OVERLAY */
.poster::after{

  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.35),
    rgba(0,0,0,.05)
  );

  pointer-events:none;
}

/* MOBILE OPTIMIZE */
@media(max-width:480px){

  .poster{
    max-width:100%;
    border-radius:0;
  }

}

</style>
</head>

<body>

<div class="poster">

  <!-- GANTI MENJADI POSTER/JPG FINAL -->
  <img src="rawon-iga.jpg" alt="Poster">
   <img src="rawon.jpg" alt="Poster">

</div>

</body>
</html>
